<div class="login-page">
  <div class="login-card">
    <div class="login-mark">
      <mat-icon>view_in_ar</mat-icon>
    </div>

    <h1 class="login-title">Sign in</h1>
    <p class="login-subtitle">Enter your email and password to continue.</p>

    <form class="login-form" (submit)="onSubmit($event)">
      <div class="field">
        <label class="field-label" for="login-email">Email</label>
        <input id="login-email" type="email" class="field-input"
               [value]="email()" (input)="email.set($any($event.target).value)"
               placeholder="name@example.com" autocomplete="email" required>
      </div>

      <div class="field">
        <label class="field-label" for="login-password">Password</label>
        <input id="login-password" type="password" class="field-input"
               [value]="password()" (input)="password.set($any($event.target).value)"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>

      @if (errorMessage()) {
        <p class="error-message">{{ errorMessage() }}</p>
      }

      <button type="submit" class="login-submit" [disabled]="isLoading()">
        @if (isLoading()) { Signing in... } @else { Sign in }
      </button>
    </form>

    <button type="button" class="forgot-link" (click)="goToForgotPassword()">
      Forgot password?
    </button>
  </div>
</div>
