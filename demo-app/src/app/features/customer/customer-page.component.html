<div class="page-content">
  <header class="hero">
    <h1 class="hero-title">Welcome back</h1>
    <p class="hero-subtitle">Browse our products or check your order history.</p>
  </header>

  <section class="action-grid">

    <button class="action-card" (click)="goToProducts()" aria-label="Browse products">
      <mat-icon class="action-icon">storefront</mat-icon>
      <div class="action-text">
        <h2 class="action-title">Browse products</h2>
        <p class="action-subtitle">Explore our catalogue and place a new order</p>
      </div>
      <mat-icon class="action-arrow">arrow_forward</mat-icon>
    </button>

    <button class="action-card" (click)="goToOrders()" aria-label="View my orders">
      <mat-icon class="action-icon">receipt_long</mat-icon>
      <div class="action-text">
        <h2 class="action-title">My orders</h2>
        <p class="action-subtitle">Track current and past orders</p>
      </div>
      <mat-icon class="action-arrow">arrow_forward</mat-icon>
    </button>

  </section>
</div>
