<div class="map-card">
  <header class="card-header">
    <h2 class="card-title">Order map</h2>
    @if (pinCount() > 0) {
      <span class="pin-count">{{ pinCount() }} cities</span>
    }
  </header>

  <div #mapContainer class="map-canvas"
       role="region" aria-label="Order destinations map">
  </div>

  @if (hasError()) {
    <p class="map-error">Could not load map data.</p>
  }
</div>
