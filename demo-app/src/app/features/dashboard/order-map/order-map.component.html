<div class="map-card">
  <header class="card-header">
    <h2 class="card-title">Order map</h2>
    <div class="map-legend">
      <div class="legend-item"><div class="legend-dot delivered"></div>Delivered</div>
      <div class="legend-item"><div class="legend-dot shipped"></div>Shipped</div>
      <div class="legend-item"><div class="legend-dot pending"></div>Pending</div>
    </div>
  </header>

  <div #mapContainer class="map-canvas"
       [class.is-loading]="isLoading()"
       role="region" aria-label="Order destinations map">
  </div>

  @if (hasError()) {
    <p class="map-error">Could not load map data.</p>
  }
</div>
